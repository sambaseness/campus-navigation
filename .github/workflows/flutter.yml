name: Flutter CI

on:
  push:
    branches: [main, remote-mapping]
  pull_request:
    branches: [main, remote-mapping]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
